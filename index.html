<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IJN Digital Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f5;
      color: #003153;
      overflow-x: hidden;
    }

    .reader-header {
      background: #003153;
      color: white;
      padding: 18px 30px;
    }

    .reader-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .reader-header p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    .book-info {
      text-align: center;
      padding: 24px 20px 10px;
    }

    .book-info h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .book-info p {
      margin: 0;
      color: #66717d;
      font-size: 18px;
    }

    #status {
      text-align: center;
      margin: 15px;
      font-size: 14px;
    }

    .reader-stage {
      width: 100%;
      min-height: 70vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #book {
      margin: auto;
    }

    .page {
      background: white;
      overflow: hidden;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toolbar {
      position: sticky;
      bottom: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      padding: 14px 18px;

      background: rgba(0, 49, 83, 0.96);
      color: white;

      z-index: 999;
    }

    .toolbar button {
      border: none;
      background: #2D99C9;
      color: white;

      padding: 10px 16px;
      border-radius: 6px;

      font-size: 15px;
      cursor: pointer;
    }

    .toolbar button:hover {
      opacity: 0.9;
    }

    #page-counter {
      min-width: 120px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    @media (max-width: 768px) {

      .reader-header {
        padding: 14px 18px;
      }

      .reader-header h1 {
        font-size: 20px;
      }

      .book-info h2 {
        font-size: 23px;
      }

      .book-info p {
        font-size: 15px;
      }

      .reader-stage {
        padding: 8px;
        min-height: 68vh;
      }

      .toolbar {
        gap: 8px;
        padding: 10px;
      }

      .toolbar button {
        padding: 9px 13px;
      }

      #page-counter {
        min-width: 90px;
      }
    }
  </style>
</head>

<body>

  <header class="reader-header">
    <h1>IJN Digital Reader</h1>
    <p>Institut Jantung Negara</p>
  </header>

  <section class="book-info">
    <h2 id="book-title">Loading publication...</h2>
    <p id="book-subtitle"></p>
  </section>

  <div id="status">
    Preparing publication...
  </div>

  <div class="reader-stage">
    <div id="book"></div>
  </div>

  <div class="toolbar">
    <button id="prev-btn">← Previous</button>

    <div id="page-counter">
      Page 1
    </div>

    <button id="next-btn">Next →</button>
  </div>


  <!-- PAGE FLIP LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


  <script type="module">

    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.mjs";


    async function loadBook() {

      const params =
        new URLSearchParams(window.location.search);

      const bookId =
        params.get("book");


      const status =
        document.getElementById("status");

      const titleElement =
        document.getElementById("book-title");

      const subtitleElement =
        document.getElementById("book-subtitle");

      const bookContainer =
        document.getElementById("book");

      const pageCounter =
        document.getElementById("page-counter");


      if (!bookId) {

        titleElement.textContent =
          "No publication selected";

        status.innerHTML =
          '<span class="error">Please use a valid publication link.</span>';

        return;
      }


      try {

        /*
        -------------------------
        GET BOOK INFORMATION
        -------------------------
        */

        const response =
          await fetch("library/books.json");

        if (!response.ok) {
          throw new Error("Unable to load books.json");
        }


        const books =
          await response.json();


        const book =
          books[bookId];


        if (!book) {

          titleElement.textContent =
            "Publication not found";

          status.innerHTML =
            '<span class="error">This publication does not exist.</span>';

          return;
        }


        titleElement.textContent =
          book.title;

        subtitleElement.textContent =
          book.subtitle || "";


        /*
        -------------------------
        CHECK PDF PATH
        -------------------------
        */

        if (!book.pdf) {
          throw new Error(
            `PDF path missing for ${bookId}`
          );
        }


        /*
        -------------------------
        BUILD PDF URL
        -------------------------
        */

        const pdfUrl =
          new URL(
            book.pdf,
            window.location.href
          ).href;


        console.log(
          "Loading PDF:",
          pdfUrl
        );


        status.textContent =
          "Loading publication...";


        /*
        -------------------------
        LOAD PDF
        -------------------------
        */

        const pdf =
          await pdfjsLib.getDocument({
            url: pdfUrl
          }).promise;


        status.textContent =
          `Preparing ${pdf.numPages} pages...`;


        /*
        -------------------------
        CREATE HTML PAGES
        -------------------------
        */

        const pageElements = [];


        for (
          let pageNumber = 1;
          pageNumber <= pdf.numPages;
          pageNumber++
        ) {

          const page =
            await pdf.getPage(pageNumber);


          const baseViewport =
            page.getViewport({
              scale: 1
            });


          /*
          Render at a reasonable quality.
          */

          const scale = 1.5;

          const viewport =
            page.getViewport({
              scale: scale
            });


          /*
          CREATE PAGE
          */

          const pageElement =
            document.createElement("div");

          pageElement.className =
            "page";


          /*
          Make first and last page act
          more like book covers.
          */

          if (
            pageNumber === 1 ||
            pageNumber === pdf.numPages
          ) {
            pageElement.dataset.density =
              "hard";
          }


          /*
          CREATE CANVAS
          */

          const canvas =
            document.createElement("canvas");

          const context =
            canvas.getContext("2d");


          canvas.width =
            Math.floor(viewport.width);

          canvas.height =
            Math.floor(viewport.height);


          pageElement.appendChild(canvas);

          bookContainer.appendChild(pageElement);

          pageElements.push(pageElement);


          /*
          RENDER PAGE
          */

          await page.render({

            canvasContext: context,
            viewport: viewport

          }).promise;

        }


        /*
        -------------------------
        GET PDF PAGE RATIO
        -------------------------
        */

        const firstPage =
          await pdf.getPage(1);

        const originalViewport =
          firstPage.getViewport({
            scale: 1
          });


        const pageWidth =
          originalViewport.width;

        const pageHeight =
          originalViewport.height;


        /*
        -------------------------
        CREATE PAGE FLIP
        -------------------------
        */

        const pageFlip =
          new St.PageFlip(
            bookContainer,
            {

              width: pageWidth,

              height: pageHeight,

              size: "stretch",

              minWidth: 280,

              maxWidth: 650,

              minHeight: 380,

              maxHeight: 900,

              maxShadowOpacity: 0.45,

              showCover: true,

              mobileScrollSupport: false,

              usePortrait: true,

              flippingTime: 700,

              drawShadow: true,

              autoSize: true

            }
          );


        /*
        Load the HTML pages
        */

        pageFlip.loadFromHTML(
          document.querySelectorAll(".page")
        );


        /*
        -------------------------
        PAGE COUNTER
        -------------------------
        */

        function updatePageCounter(index) {

          const humanPage =
            index + 1;

          pageCounter.textContent =
            `${humanPage} / ${pdf.numPages}`;

        }


        updatePageCounter(0);


        pageFlip.on(
          "flip",
          (event) => {

            updatePageCounter(
              event.data
            );

          }
        );


        /*
        -------------------------
        PREVIOUS BUTTON
        -------------------------
        */

        document
          .getElementById("prev-btn")
          .addEventListener(
            "click",
            () => {

              pageFlip.flipPrev();

            }
          );


        /*
        -------------------------
        NEXT BUTTON
        -------------------------
        */

        document
          .getElementById("next-btn")
          .addEventListener(
            "click",
            () => {

              pageFlip.flipNext();

            }
          );


        status.textContent =
          `${pdf.numPages} pages ready. Swipe or drag the page to read.`;

      }


      catch (error) {

        console.error(
          "IJN Digital Reader Error:",
          error
        );

        status.innerHTML =
          '<span class="error">Unable to create flipbook. Please check the browser console.</span>';

      }

    }


    loadBook();

  </script>

</body>
</html>
