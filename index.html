<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IJN Digital Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f5;
      color: #003153;
    }

    .reader-header {
      background: #003153;
      color: white;
      padding: 18px 30px;
    }

    .reader-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .reader-header p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    .book-info {
      text-align: center;
      padding: 28px 20px 15px;
    }

    .book-info h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .book-info p {
      margin: 0;
      color: #66717d;
      font-size: 18px;
    }

    #status {
      text-align: center;
      margin: 20px;
      font-size: 16px;
    }

    #pdf-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    .pdf-page {
      background: white;
      box-shadow: 0 8px 25px rgba(0, 49, 83, 0.12);
      border-radius: 4px;
      overflow: hidden;
      max-width: 100%;
    }

    .pdf-page canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .page-number {
      text-align: center;
      padding: 10px;
      color: #65727c;
      font-size: 13px;
      background: white;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    @media (max-width: 768px) {

      .reader-header {
        padding: 15px 18px;
      }

      .reader-header h1 {
        font-size: 20px;
      }

      .book-info h2 {
        font-size: 24px;
      }

      #pdf-pages {
        padding: 10px;
        gap: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="reader-header">
    <h1>IJN Digital Reader</h1>
    <p>Institut Jantung Negara</p>
  </header>

  <section class="book-info">
    <h2 id="book-title">Loading publication...</h2>
    <p id="book-subtitle"></p>
  </section>

  <div id="status">
    Preparing publication...
  </div>

  <main id="pdf-pages"></main>


  <script type="module">

    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.mjs";


    async function loadBook() {

      const params = new URLSearchParams(window.location.search);

      const bookId = params.get("book");

      const status = document.getElementById("status");
      const pagesContainer = document.getElementById("pdf-pages");

      if (!bookId) {

        document.getElementById("book-title").textContent =
          "No publication selected";

        status.innerHTML =
          '<span class="error">Please use a valid publication link.</span>';

        return;
      }


      try {

        /*
        -------------------------
        GET BOOK INFORMATION
        -------------------------
        */

        const response =
          await fetch("library/books.json");

        if (!response.ok) {
          throw new Error("Unable to load books.json");
        }

        const books =
          await response.json();

        const book =
          books[bookId];


        if (!book) {

          document.getElementById("book-title").textContent =
            "Publication not found";

          status.innerHTML =
            '<span class="error">This publication does not exist in the digital library.</span>';

          return;
        }


        document.getElementById("book-title").textContent =
          book.title;

        document.getElementById("book-subtitle").textContent =
          book.subtitle || "";


        status.textContent =
          "Loading PDF...";


        /*
        -------------------------
        LOAD PDF
        -------------------------
        */

        const pdf =
          await pdfjsLib.getDocument(book.pdf).promise;


        status.textContent =
          `Rendering ${pdf.numPages} pages...`;


        /*
        -------------------------
        RENDER EVERY PAGE
        -------------------------
        */

        for (
          let pageNumber = 1;
          pageNumber <= pdf.numPages;
          pageNumber++
        ) {

          const page =
            await pdf.getPage(pageNumber);


          /*
          Higher number = sharper PDF,
          but also heavier browser workload.
          */

          const scale = 1.5;

          const viewport =
            page.getViewport({ scale });


          /*
          PAGE WRAPPER
          */

          const pageWrapper =
            document.createElement("div");

          pageWrapper.className =
            "pdf-page";


          /*
          CANVAS
          */

          const canvas =
            document.createElement("canvas");

          const context =
            canvas.getContext("2d");

          canvas.width =
            viewport.width;

          canvas.height =
            viewport.height;


          pageWrapper.appendChild(canvas);


          /*
          PAGE NUMBER
          */

          const pageLabel =
            document.createElement("div");

          pageLabel.className =
            "page-number";

          pageLabel.textContent =
            `Page ${pageNumber} of ${pdf.numPages}`;


          pageWrapper.appendChild(pageLabel);

          pagesContainer.appendChild(pageWrapper);


          /*
          RENDER PDF PAGE
          */

          await page.render({

            canvasContext: context,
            viewport: viewport

          }).promise;

        }


        status.textContent =
          `${pdf.numPages} pages loaded successfully.`;


      }

      catch (error) {

        console.error(error);

        status.innerHTML =
          '<span class="error">Unable to load the PDF. Please check the browser console.</span>';

      }

    }


    loadBook();

  </script>

</body>
</html>
