<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IJN Digital Library | Institut Jantung Negara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#003153;--blue:#2d99c9;--ink:#102e49;--muted:#708297;--line:#dce7ef}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:#f4f7fa;color:var(--ink)}header{background:linear-gradient(110deg,#003153,#07527a);color:white;padding:17px clamp(18px,4vw,70px);display:flex;align-items:center;gap:16px}header img{width:62px;height:48px;object-fit:contain}header strong{display:block;font-size:19px}header small{font-size:10px;letter-spacing:1px;opacity:.75}.hero{padding:65px 20px 45px;text-align:center;background:radial-gradient(ellipse at 50% 0,#e3f2fa,transparent 70%)}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:#1685b8;text-transform:uppercase}.hero h1{font-size:clamp(30px,4vw,48px);margin:12px 0}.hero p{color:var(--muted);margin:0 auto 25px;max-width:650px;font-size:14px}.search{display:flex;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;max-width:550px;margin:auto;box-shadow:0 10px 30px #0031530a}.search input{width:100%;border:0;background:transparent;padding:17px 20px;font:inherit;outline:none;font-size:13px}.container{max-width:1300px;margin:auto;padding:20px 30px 100px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:35px}.filter{border:1px solid var(--line);border-radius:30px;padding:10px 18px;background:white;color:#456177;font:500 12px Poppins;cursor:pointer}.filter.active,.filter:hover{background:var(--navy);color:white}.section{margin:30px 0 55px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:12px}.section h2{font-size:22px;margin:0}.section small{color:var(--muted)}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:35px 24px;padding:20px 25px 38px;position:relative;border-radius:16px 16px 0 0;background:linear-gradient(180deg,#fff,#edf3f7)}.shelf:after{content:"";position:absolute;bottom:0;left:0;right:0;height:18px;border-radius:3px;background:linear-gradient(#c7dce8,#8eafc3 55%,#d9e8f1);box-shadow:0 12px 17px #123c5a24}.book{display:block;text-decoration:none;color:inherit;min-width:0;outline-offset:8px}.cover{height:245px;width:100%;max-width:175px;margin:auto;position:relative;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:5px 8px 13px #173c5c32,inset 5px 0 7px #0002;transform-origin:bottom center;transition:transform .3s,box-shadow .3s;background:linear-gradient(140deg,#003153,#237da9);display:flex;flex-direction:column;justify-content:space-between;padding:18px;color:white}.cover:before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:#ffffff45;z-index:2}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover .fallback-title{font-weight:700;font-size:16px;line-height:1.4;overflow-wrap:anywhere}.cover .fallback-brand{font-size:10px;letter-spacing:1px;opacity:.75}.book:hover .cover,.book:focus-visible .cover{transform:translateY(-13px) rotate(-2deg);box-shadow:10px 17px 20px #173c5c45}.book h3{font-size:12px;font-weight:600;line-height:1.5;margin:16px 0 4px;overflow-wrap:anywhere}.book p{font-size:11px;color:var(--muted);margin:0}.empty{padding:60px;text-align:center;color:var(--muted)}footer{text-align:center;padding:24px;color:#7a8a99;font-size:11px}@media(max-width:650px){header img{width:50px}.hero{padding:45px 18px 35px}.container{padding:15px 14px 60px}.section h2{font-size:18px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 16px;padding:20px 12px 32px}.cover{height:clamp(175px,56vw,245px)}.filters{gap:7px}.filter{padding:8px 12px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.cover{transition:none}.book:hover .cover{transform:none}}
</style>
</head>
<body>
<header><img src="ijn-logo.png" alt="IJN logo"><div><strong>Digital Library</strong><small>INSTITUT JANTUNG NEGARA</small></div></header>
<section class="hero"><div class="eyebrow">IJN Knowledge Collection</div><h1>Explore Our Digital Library</h1><p>Browse handbooks, patient guides, reports and publications in one convenient place.</p><label class="search"><input id="search" type="search" placeholder="Search publications by title or year..." aria-label="Search publications"></label></section>
<main class="container"><nav class="filters" id="filters" aria-label="Publication categories"></nav><div id="sections" aria-live="polite"><div class="empty">Loading library...</div></div></main>
<footer>© Institut Jantung Negara · Digital Library</footer>
<script>
const LABELS={"patient-guide":"Patient Guides","patient-guides":"Patient Guides","handbook":"Handbooks","handbooks":"Handbooks","annual-report":"Annual Reports","annual-reports":"Annual Reports","clinical":"Clinical Publications","clinical-publication":"Clinical Publications","publication":"Publications","publications":"Publications"};
const $=id=>document.getElementById(id);let allBooks=[],active='all';
const label=key=>LABELS[key]||String(key||'Other Publications').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function make(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function render(){const q=$('search').value.toLowerCase().trim();const filtered=allBooks.filter(b=>(active==='all'||b.category===active)&&[b.title,b.subtitle,b.year,b.category].join(' ').toLowerCase().includes(q));const root=$('sections');root.replaceChildren();if(!filtered.length){root.append(make('div','empty','No publications found.'));return}const groups=new Map();for(const b of filtered){if(!groups.has(b.category))groups.set(b.category,[]);groups.get(b.category).push(b)}for(const [cat,books] of groups){const section=make('section','section'),head=make('div','section-head'),title=make('h2','',label(cat)),count=make('small','',`${books.length} ${books.length===1?'publication':'publications'}`),shelf=make('div','shelf');head.append(title,count);section.append(head,shelf);for(const b of books){const a=make('a','book');a.href=`index.html?book=${encodeURIComponent(b.id)}`;a.setAttribute('aria-label',`Read ${b.title}`);const cover=make('div','cover');if(b.cover){const img=make('img');img.src=b.cover;img.alt=`Cover of ${b.title}`;img.loading='lazy';img.onerror=()=>{img.remove();cover.append(make('div','fallback-brand','IJN DIGITAL LIBRARY'),make('div','fallback-title',b.title))};cover.append(img)}else{cover.append(make('div','fallback-brand','IJN DIGITAL LIBRARY'),make('div','fallback-title',b.title))}a.append(cover,make('h3','',b.title),make('p','',String(b.year||b.subtitle||'')));shelf.append(a)}root.append(section)}}
function renderFilters(){const nav=$('filters');nav.replaceChildren();const categories=['all',...new Set(allBooks.map(b=>b.category))];for(const cat of categories){const button=make('button','filter'+(cat===active?' active':''),cat==='all'?'All Publications':label(cat));button.type='button';button.setAttribute('aria-pressed',String(cat===active));button.addEventListener('click',()=>{active=cat;renderFilters();render()});nav.append(button)}}
async function init(){try{const res=await fetch('library/books.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();allBooks=Object.entries(data).filter(([,b])=>b&&typeof b==='object'&&b.pdf).map(([id,b])=>({...b,id,category:String(b.category||'other').toLowerCase()}));renderFilters();render()}catch(e){console.error(e);$('sections').replaceChildren(make('div','empty','Unable to load the library. Check library/books.json.'))}}
$('search').addEventListener('input',render);init();
</script>
</body>
</html>
